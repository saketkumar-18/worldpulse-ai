name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: worldpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_TOKEN: ci-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Test (SQLite)
        run: python -m pytest -q
      - name: Migrations against Postgres
        run: |
          DATABASE_URL="postgresql+psycopg://postgres:postgres@localhost:5432/worldpulse_test" alembic upgrade head
          DATABASE_URL="postgresql+psycopg://postgres:postgres@localhost:5432/worldpulse_test" alembic check
