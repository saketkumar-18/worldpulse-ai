# Calls the live app's admin collection endpoint every 15 minutes.
# This is the reliable schedule: it runs the same collection the app runs, on the live site.
name: Trigger live collection
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: trigger-live
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect on the live site
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # Free Render instances sleep; the first request can take ~50s. Allow for that.
          code=$(curl -sS -m 280 -o resp.json -w "%{http_code}" -X POST \
            -H "X-Admin-Token: $ADMIN_TOKEN" "$APP_URL/api/admin/collect")
          echo "HTTP $code"
          cat resp.json | python -c "import sys,json; d=json.load(sys.stdin); print([(r['provider'],r['status'],r.get('inserted')) for r in d['ingestion']])"
          test "$code" = "200"
