# Calls the live app's admin collection endpoint every 15 minutes.
# This is the reliable schedule: it runs the same collection the app runs, on the live site.
name: Trigger live collection
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: trigger-live
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect on the live site
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # Free Render instances return 502/503 while they wake. Retry those with backoff.
          code=000
          for attempt in 1 2 3 4; do
            code=$(curl -sS -m 280 -o resp.json -w "%{http_code}" -X POST \
              -H "X-Admin-Token: $ADMIN_TOKEN" "$APP_URL/api/admin/collect" || echo 000)
            echo "attempt $attempt: HTTP $code"
            case "$code" in
              502|503|504|000) sleep $((attempt * 30)) ;;
              *) break ;;
            esac
          done
          if [ "$code" != "200" ]; then
            echo "collection failed with HTTP $code"
            head -c 300 resp.json 2>/dev/null || true
            exit 1
          fi
          python -c "import json; d=json.load(open('resp.json')); print([(r['provider'],r['status'],r.get('inserted')) for r in d['ingestion']])"
