# Free scheduled collection and briefings with GitHub Actions cron (times are UTC).
# 07:00 and 19:00 Asia/Kolkata = 01:30 and 13:30 UTC.
name: Collect and brief
on:
  schedule:
    - cron: "*/30 * * * *"   # collection every 30 minutes
    - cron: "30 1 * * *"     # morning briefing, 07:00 IST
    - cron: "30 13 * * *"    # evening briefing, 19:00 IST
    - cron: "5,20,35,50 * * * *"   # per-user briefings: sent when each user's chosen time is due
  workflow_dispatch:
    inputs:
      job:
        description: "collect | briefing-morning | briefing-evening | personal | purge"
        default: collect

concurrency:
  group: collect-brief
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      NOTIFY_RECIPIENTS: ${{ secrets.NOTIFY_RECIPIENTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrate
        run: alembic upgrade head
      - name: Run job
        run: |
          case "${{ github.event.schedule || github.event.inputs.job }}" in
            "*/30 * * * *"|collect) python -m app.scheduler collect ;;
            "30 1 * * *"|briefing-morning) python -m app.scheduler briefing morning ;;
            "30 13 * * *"|briefing-evening) python -m app.scheduler briefing evening ;;
            "5,20,35,50 * * * *"|personal) python -m app.scheduler personal morning && python -m app.scheduler personal evening ;;
            purge) python -m app.scheduler purge ;;
            *) python -m app.scheduler collect ;;
          esac
